<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#f4eed8"/>
  <title>Notebook Sticks</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="ui.css"/>
</head>
<body>
  <div id="boot">
    <div class="sheet">
      <p class="kicker">a shared sketchbook</p>
      <h1>Notebook Sticks</h1>
      <p class="sub">Walk the pages. Draw gear. Meet other doodles.</p>
      <canvas id="preview" width="180" height="160"></canvas>
      <label for="name">Name</label>
      <input id="name" type="text" maxlength="16" placeholder="Doodle" autocomplete="username" autofocus/>
      <label for="pin">Password / PIN</label>
      <input id="pin" type="password" maxlength="64" placeholder="4+ characters" autocomplete="current-password"/>
      <div id="saved-accounts"></div>
      <label>Ink color</label>
      <div class="row" id="colors"></div>
      <label>Hat</label>
      <div class="row" id="hats"></div>
      <label>Walk</label>
      <div class="row" id="boot-walks"></div>
      <button class="play" id="go" type="button">Open the notebook</button>
    </div>
  </div>
  <canvas id="game"></canvas>
  <div id="hud">
    <div id="br-banner"></div>
    <div id="replay-hud"></div>
    <div id="status">Cover</div>
    <div id="hint" hidden>Walk.</div>
    <div id="who" hidden></div>
    <div id="here" hidden></div>
    <div id="ink">40 ink</div>
    <button id="member-badge" type="button" hidden data-tier="free">free</button>
    <button id="admin-badge" type="button" hidden>admin</button>
    <div id="pages" hidden></div>
    <canvas id="mini" width="160" height="104" hidden></canvas>
    <div id="dest" hidden></div>
    <div id="roster" hidden></div>
    <div id="chatlog"></div>
    <div id="shop"></div>
    <div id="member-box"></div>
    <div id="friends"></div>
    <div id="game-panel"></div>
    <div id="admin-box"></div>
    <div id="replay-box"></div>
    <div id="job-panel"></div>
    <div id="house-panel"></div>
    <div id="party-box"></div>
    <div id="mail-box"></div>
    <div id="trade-box"></div>
    <div id="profile-box"></div>
    <div id="store-box"></div>
    <div id="more-box"></div>
    <div id="studio-box"></div>
    <div id="bazaar-box"></div>
    <div id="where-box"></div>
    <div id="pack-box"></div>
    <div id="quest-box"></div>
    <div id="club-box"></div>
    <div id="board-box"></div>
    <div id="notes-box"></div>
    <div id="prompt-box"></div>
    <div class="bar">
      <button id="where-toggle" type="button">Map</button>
      <button id="studio-toggle" type="button">Draw</button>
      <button id="profile-toggle" type="button">Me</button>
      <button id="interact-toggle" type="button">Talk</button>
      <button id="more-toggle" type="button">More</button>
      <button id="sfx-toggle" type="button">Sound</button>
      <input id="chat" maxlength="140" placeholder="say something, or /plaza"/>
      <button id="pose-wave" type="button" hidden>Wave</button>
      <button id="pose-sit" type="button" hidden>Sit</button>
      <button id="pose-dance" type="button" hidden>Dance</button>
      <button id="look-toggle" type="button" hidden>Look</button>
      <button id="bazaar-toggle" type="button" hidden>Bazaar</button>
      <button id="friends-toggle" type="button" hidden>Friends</button>
      <button id="party-toggle" type="button" hidden>Party</button>
      <button id="club-toggle" type="button" hidden>Clubs</button>
      <button id="board-toggle" type="button" hidden>Board</button>
      <button id="notes-toggle" type="button" hidden>Notes</button>
      <button id="pack-toggle" type="button" hidden>Pack</button>
      <button id="quest-toggle" type="button" hidden>Today</button>
      <button id="mail-toggle" type="button" hidden>Mail</button>
      <button id="jobs-toggle" type="button" hidden>Jobs</button>
      <button id="house-toggle" type="button" hidden>Home</button>
      <button id="replay-toggle" type="button" hidden>Replay</button>
      <button id="admin-toggle" type="button" hidden>Admin</button>
      <button id="store-toggle" type="button" hidden>Store</button>
      <button id="member-toggle" type="button" hidden>Member</button>
    </div>
    <div id="look">
      <b>Look</b>
      <div class="row" id="look-colors"></div>
      <div class="row" id="look-hats"></div>
      <div class="row" id="look-extras"></div>
      <div class="sub">Walk</div>
      <div class="row" id="look-walks"></div>
      <div class="sub">Full closet is under Draw</div>
    </div>
  </div>
  <script src="sound.js"></script>
  <script src="account.js"></script>
  <script src="membership.js"></script>
  <script src="mock-net.js"></script>
  <script src="world.js"></script>
  <script src="fill.js"></script>
  <script src="cover-town.js"></script>
  <script src="toys.js"></script>
  <script src="pack.js"></script>
  <script src="purpose.js"></script>
  <script src="play.js"></script>
  <script src="realm.js"></script>
  <script src="clubs.js"></script>
  <script src="rooms.js"></script>
  <script src="engine.js"></script>
  <script src="shop.js"></script>
  <script src="fun.js"></script>
  <script src="social.js"></script>
  <script src="games.js"></script>
  <script src="admin.js"></script>
  <script src="replay.js"></script>
  <script src="jobs.js"></script>
  <script src="houses.js"></script>
  <script src="money.js"></script>
  <script src="pay.js"></script>
  <script src="ui.js"></script>
  <script src="gear.js"></script>
  <script src="core.js"></script>
  <script src="game.js"></script>
  <script src="anim.js"></script>
  <script src="walk-ui.js"></script>
  <script src="maker.js"></script>
  <script src="netplay.js"></script>
  <script src="patch.js"></script>
  <script src="hooks.js"></script>
</body>
</html>
